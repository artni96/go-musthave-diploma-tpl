services:
  test-db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - "${TEST_OUTER_DB_PORT}:${TEST_INNER_DB_PORT}"
    volumes:
      - test_postgres_data:/var/lib/postgresql

volumes:
  test_postgres_data: