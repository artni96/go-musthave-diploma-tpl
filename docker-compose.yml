services:
  test-db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: